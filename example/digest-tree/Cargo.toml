[package]
name = "digest-tree-examples"
version = "0.0.0"
edition = "2021"
publish = false

# This preview pins the implemented, unmerged durable replication branch.
[dependencies]
ankurah = { git = "https://github.com/ankurah/ankurah", rev = "6fe7640d1192bcf636fe27e9a26b57f72920644b", features = ["derive"] }
ankurah-core-types = { git = "https://github.com/ankurah/ankurah", rev = "6fe7640d1192bcf636fe27e9a26b57f72920644b" }
ankurah-connector-local-process = { git = "https://github.com/ankurah/ankurah", rev = "6fe7640d1192bcf636fe27e9a26b57f72920644b" }
ankurah-digest-tree = { git = "https://github.com/ankurah/ankurah", rev = "6fe7640d1192bcf636fe27e9a26b57f72920644b", features = ["test-support"] }
ankurah-storage-sqlite = { git = "https://github.com/ankurah/ankurah", rev = "6fe7640d1192bcf636fe27e9a26b57f72920644b" }
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

# Keep this preview independent of the website's application example.
[workspace]
