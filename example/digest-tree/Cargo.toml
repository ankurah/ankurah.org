[package]
name = "digest-tree-examples"
version = "0.0.0"
edition = "2021"
publish = false

# This preview pins the implemented, unmerged Node integration branch.
[dependencies]
ankurah = { git = "https://github.com/ankurah/ankurah", rev = "d635ea5358396a2812526175f30471266ab7d8bb", features = ["derive"] }
ankurah-core-types = { git = "https://github.com/ankurah/ankurah", rev = "d635ea5358396a2812526175f30471266ab7d8bb" }
ankurah-digest-tree = { git = "https://github.com/ankurah/ankurah", rev = "d635ea5358396a2812526175f30471266ab7d8bb", features = ["test-support"] }
ankurah-storage-sqlite = { git = "https://github.com/ankurah/ankurah", rev = "d635ea5358396a2812526175f30471266ab7d8bb" }
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

# Keep this preview independent of the website's application example.
[workspace]
