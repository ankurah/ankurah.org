<!-- Shared controls are materialized into the figure pages by Liaison. -->
<div id="playback-controls">
  <button id="play" class="primary" aria-pressed="false">Play</button>
  <button id="previous" aria-label="Previous step">←</button>
  <button id="next" aria-label="Next step">→</button>
  <input
    id="progress"
    type="range"
    min="0"
    max="4"
    value="0"
    aria-label="Explanation step"
  />
  <span id="step" class="step-label">0 / 4</span>
</div>
